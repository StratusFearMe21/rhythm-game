<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Ransom is My Rhythm</title>
    <link rel="stylesheet" href="/styles/index.css" />
    <link rel="stylesheet" href="/styles/fonts.css" />
    <link rel="stylesheet" href="/styles/game.css" />
    <link rel="stylesheet" href="/styles/misc.css" />
    <link rel="stylesheet" href="/styles/flex.css" />

    <script defer src="/public/components.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body x-data="game">
    <template x-if="!confirmedStart">
      <h1 class="countdown">Press Any Key to Start</h1>
    </template>
    <template x-if="countdown > 0 && confirmedStart">
      <h1 class="countdown" x-text="countdown"></h1>
    </template>
    <template x-if="countdown == 0 && confirmedStart">
      <h1 class="countdown">GO</h1>
    </template>

    <div class="rhythm-input-track flex-row flex-space-between">
      <button class="rhythm-input" @click="handleInput('s')">S</button>
      <button class="rhythm-input" @click="handleInput('f')">F</button>
      <button class="rhythm-input" @click="handleInput('j')">J</button>
      <button class="rhythm-input" @click="handleInput('l')">L</button>
    </div>

    <pre class="combo-counter" x-text="'COMBO\n' + combo + 'x'"></pre>
    <p class="points-counter" x-text="results.points"></p>

    <div x-cloak x-show="songEnded" class="game-over-overlay-background"></div>
    <div x-cloak x-show="songEnded" class="game-over-overlay">
      <div class="flex-col flex-space-between full-height">
        <h1>FINISH!</h1>
        <div class="flex-col">
          <pre x-text="`POINTS\n${results.points}`"></pre>
          <pre x-text="`MAX COMBO\n${results.maxCombo}`"></pre>
          <pre
            x-text="`ACCURACY\n${Math.round(results.accuracy * 100)}%`"
          ></pre>
        </div>
        <a href="/">Back to Songs</a>
      </div>
    </div>

    <div class="note-container">
      <template x-for="note in notes">
        <div class="note" :style="note.style()" x-text="note.index + 1"></div>
      </template>
    </div>
  </body>
</html>

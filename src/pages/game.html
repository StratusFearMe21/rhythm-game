<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Ransom is My Rhythm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Foldit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/colors.css" />
    <link rel="stylesheet" href="../styles/game.css" />
    <link rel="stylesheet" href="../styles/misc.css" />
    <link rel="stylesheet" href="../styles/flex.css" />

    <script defer src="../scripts/components.ts"></script>
  </head>
  <body x-data="game">
    <div class="background-simplex">
      <template x-for="(v, i) in backgroundSimplex">
        <div
          class="node"
          :style="{
            left: `${(i % 25) * 4}%`,
            top: `${Math.floor(i / 25) * 4}%`,
            backgroundColor: `color-mix(in srgb, var(--text) ${(1 - v) * 100}%, var(--text-tint) ${v * 100}%)`,
            transform: `scale(${1 + v})`
          }"
        ></div>
      </template>
    </div>

    <template x-if="!confirmedStart">
      <h1 class="countdown">Press Any Key to Start</h1>
    </template>
    <template x-if="countdown > 0 && confirmedStart">
      <h1 class="countdown" x-text="countdown"></h1>
    </template>
    <template x-if="countdown == 0 && confirmedStart">
      <h1 class="countdown">GO</h1>
    </template>

    <div class="rhythm-input-track flex-row flex-space-between">
      <button @click="handleInput('s')" :pressed="isPressing('s')">S</button>
      <button @click="handleInput('f')" :pressed="isPressing('f')">F</button>
      <button @click="handleInput('j')" :pressed="isPressing('j')">J</button>
      <button @click="handleInput('l')" :pressed="isPressing('l')">L</button>
    </div>

    <pre class="combo-counter" x-text="'COMBO\n' + combo + 'x'"></pre>
    <p class="points-counter" x-text="results.points"></p>

    <div x-cloak x-show="songEnded" class="game-over-overlay-background"></div>
    <div x-cloak x-show="songEnded" class="game-over-overlay">
      <div class="flex-col flex-space-between full-height">
        <h1>FINISH!</h1>
        <div class="flex-col">
          <pre x-text="`POINTS\n${results.points}`"></pre>
          <pre x-text="`MAX COMBO\n${results.maxCombo}`"></pre>
          <pre
            x-text="`ACCURACY\n${Math.round(results.accuracy * 100)}%`"
          ></pre>
        </div>
        <a href="/">Back to Songs</a>
      </div>
    </div>

    <div class="note-container">
      <div class="timing-bar"></div>
      <div
        x-show="countdown > 0"
        x-transition.duration.500ms
        class="timing-arrow"
        right
        x-data="svgs"
      >
        <span x-html="arrow"></span>
      </div>
      <div
        x-show="countdown > 0"
        x-transition.duration.500ms
        class="timing-arrow"
        left
        x-data="svgs"
      >
        <span x-html="arrow"></span>
      </div>

      <template x-for="note in notes">
        <div class="note" :style="note.style()"></div>
      </template>
    </div>
  </body>
</html>
